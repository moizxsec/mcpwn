name: Docs

# Build the documentation website (Astro + Starlight, with the TypeDoc API
# reference published verbatim under /api) and deploy it to GitHub Pages.
# Independent of the CI workflow — a docs failure never blocks a merge's
# build/test gate. The site build lives entirely in docs-site/ and does not
# touch the published npm package.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege: only what Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight Pages deploy at a time; let a running deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install root deps (clean, from lockfile)
        run: npm ci
      - name: Install docs-site deps (clean, from lockfile)
        run: npm --prefix docs-site ci
      - name: Build site (TypeDoc -> docs-site/public/api, then Astro -> docs-site/dist)
        run: npm run docs:site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    name: deploy pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
